<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI颜值测评 - 专业脸型五官分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 动态粒子背景 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #a78bfa, #f472b6, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 4s ease infinite;
            letter-spacing: 2px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* 标签页 */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 5px;
        }

        .tab-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-item.active {
            background: rgba(167, 139, 250, 0.25);
            color: #c4b5fd;
            font-weight: 600;
        }

        .tab-item:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeSlideIn 0.4s ease;
        }

        /* 上传区域 */
        .upload-section {
            border: 2px dashed rgba(167, 139, 250, 0.3);
            border-radius: 22px;
            padding: 55px 40px;
            text-align: center;
            margin-bottom: 24px;
            transition: all 0.4s ease;
            cursor: pointer;
            background: rgba(167, 139, 250, 0.03);
            position: relative;
            overflow: hidden;
        }

        .upload-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.06), transparent);
            transition: left 0.6s ease;
        }

        .upload-section:hover::before {
            left: 100%;
        }

        .upload-section:hover {
            border-color: rgba(167, 139, 250, 0.6);
            background: rgba(167, 139, 250, 0.08);
            transform: translateY(-2px);
        }

        .upload-section.drag-over {
            border-color: #a78bfa;
            background: rgba(167, 139, 250, 0.12);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 56px;
            margin-bottom: 18px;
            display: block;
        }

        .upload-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .upload-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 22px;
        }

        .upload-btn {
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-weight: 500;
        }

        .upload-btn-primary {
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            color: white;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
        }

        .upload-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(167, 139, 250, 0.45);
        }

        .upload-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .upload-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            color: white;
        }

        #fileInput, #cameraInput {
            display: none;
        }

        /* 预览区 */
        .preview-section {
            display: none;
            margin-bottom: 28px;
        }

        .preview-section.active {
            display: block;
            animation: fadeSlideIn 0.5s ease;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .preview-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .preview-image {
            max-width: 380px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .preview-badge {
            position: absolute;
            top: 14px;
            right: calc(50% - 190px);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        .analyze-btn {
            background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
            color: white;
            border: none;
            padding: 18px 56px;
            border-radius: 50px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.4s ease;
            display: block;
            margin: 0 auto;
            font-weight: 600;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .analyze-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .analyze-btn:hover::before {
            left: 100%;
        }

        .analyze-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(167, 139, 250, 0.5);
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 50px 20px;
        }

        .loading.active {
            display: block;
            animation: fadeSlideIn 0.4s ease;
        }

        .loading-ring {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
        }

        .loading-ring svg {
            width: 80px;
            height: 80px;
            transform: rotate(-90deg);
        }

        .loading-ring circle {
            fill: none;
            stroke-width: 4;
        }

        .loading-ring .bg {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .loading-ring .progress {
            stroke: url(#loadGradient);
            stroke-linecap: round;
            stroke-dasharray: 226;
            stroke-dashoffset: 226;
            transition: stroke-dashoffset 0.5s ease;
        }

        .loading-percent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c4b5fd;
            font-size: 18px;
            font-weight: bold;
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .loading-step {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            min-height: 20px;
        }

        .loading-steps {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .step-item.done {
            color: #4ade80;
        }

        .step-item.current {
            color: #c4b5fd;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .step-item.done .step-dot {
            background: #4ade80;
        }

        .step-item.current .step-dot {
            background: #a78bfa;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.6);
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        /* 结果区域 */
        .result-section {
            display: none;
        }

        .result-section.active {
            display: block;
        }

        /* 总分卡片 */
        .score-card {
            background: linear-gradient(135deg, #a78bfa 0%, #f472b6 50%, #fb923c 100%);
            border-radius: 24px;
            padding: 44px;
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            animation: cardReveal 0.6s ease;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .score-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s ease infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        .score-label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
            position: relative;
        }

        .score-value {
            font-size: 80px;
            font-weight: 800;
            color: white;
            position: relative;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            line-height: 1;
            margin-bottom: 12px;
        }

        .score-value .unit {
            font-size: 28px;
            font-weight: 500;
            opacity: 0.8;
        }

        .score-desc {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            position: relative;
            font-weight: 500;
        }

        .score-stars {
            margin-top: 12px;
            font-size: 22px;
            position: relative;
            letter-spacing: 4px;
        }

        /* 明星对标 */
        .celeb-match {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeSlideIn 0.6s ease 0.2s both;
        }

        .celeb-match h3 {
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .celeb-list {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .celeb-tag {
            background: rgba(167, 139, 250, 0.15);
            color: #c4b5fd;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        /* 分析卡片网格 */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .analysis-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            animation: fadeSlideIn 0.5s ease both;
        }

        .analysis-card:nth-child(1) { animation-delay: 0.1s; }
        .analysis-card:nth-child(2) { animation-delay: 0.2s; }
        .analysis-card:nth-child(3) { animation-delay: 0.3s; }
        .analysis-card:nth-child(4) { animation-delay: 0.4s; }
        .analysis-card:nth-child(5) { animation-delay: 0.5s; }

        .analysis-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .analysis-card h3 {
            color: rgba(255, 255, 255, 0.9);
            font-size: 17px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-face .card-icon { background: rgba(251, 146, 60, 0.2); }
        .card-features .card-icon { background: rgba(74, 222, 128, 0.2); }
        .card-brow .card-icon { background: rgba(244, 114, 182, 0.2); }
        .card-lip .card-icon { background: rgba(248, 113, 113, 0.2); }
        .card-suggest .card-icon { background: rgba(96, 165, 250, 0.2); }

        .analysis-content {
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.85;
            font-size: 14px;
        }

        .analysis-content strong {
            color: rgba(255, 255, 255, 0.85);
        }

        /* 雷达图区域 */
        .radar-section {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeSlideIn 0.5s ease 0.5s both;
        }

        .radar-section h4 {
            color: rgba(255, 255, 255, 0.85);
            font-size: 17px;
            margin-bottom: 20px;
            text-align: center;
        }

        .radar-container {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #radarChart {
            max-width: 280px;
            width: 100%;
        }

        .radar-legend {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .legend-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            min-width: 80px;
        }

        .legend-bar-wrap {
            width: 100px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }

        .legend-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 1s ease;
            width: 0;
        }

        .legend-value {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 600;
            min-width: 30px;
            text-align: right;
        }

        /* 推荐方案 */
        .recommendation {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeSlideIn 0.5s ease 0.6s both;
        }

        .recommendation h4 {
            color: rgba(255, 255, 255, 0.85);
            font-size: 17px;
            margin-bottom: 18px;
        }

        .recommendation ul {
            list-style: none;
            padding: 0;
        }

        .recommendation li {
            padding: 10px 0;
            padding-left: 28px;
            position: relative;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.7;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .recommendation li:last-child {
            border-bottom: none;
        }

        .recommendation li::before {
            content: attr(data-icon);
            position: absolute;
            left: 0;
            font-size: 14px;
        }

        /* 底部操作栏 */
        .action-bar {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
            animation: fadeSlideIn 0.5s ease 0.7s both;
        }

        .action-btn {
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            border: none;
        }

        .btn-restart {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-share {
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            color: white;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
        }

        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(167, 139, 250, 0.45);
        }

        /* 历史记录标签页 */
        .history-empty {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .history-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .history-thumb {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .history-info {
            flex: 1;
        }

        .history-face {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .history-time {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
        }

        .history-score {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .history-clear {
            text-align: center;
            margin-top: 20px;
        }

        .history-clear button {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .history-clear button:hover {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 9999;
            transition: transform 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container {
                padding: 24px 18px;
                border-radius: 22px;
            }

            .header h1 {
                font-size: 26px;
            }

            .score-value {
                font-size: 60px;
            }

            .analysis-grid {
                grid-template-columns: 1fr;
            }

            .upload-section {
                padding: 40px 20px;
            }

            .preview-badge {
                right: 14px;
            }

            .radar-container {
                flex-direction: column;
            }

            .score-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="page-wrapper">
        <div class="container">
            <div class="header">
                <h1>AI 颜值测评</h1>
                <p>专业脸型分析 / 五官特征评估 / 个性化变美建议</p>
            </div>

            <div class="tab-bar">
                <div class="tab-item active" onclick="switchTab('main')">测评</div>
                <div class="tab-item" onclick="switchTab('history')">历史记录</div>
            </div>

            <div class="tab-content active" id="tab-main">
                <div class="upload-section" id="uploadSection">
                    <span class="upload-icon">📷</span>
                    <div class="upload-text">点击上传或拖拽照片到这里</div>
                    <div class="upload-hint">支持 JPG / PNG 格式，建议上传清晰的正面照</div>
                    <div class="upload-buttons">
                        <button class="upload-btn upload-btn-primary" onclick="event.stopPropagation(); document.getElementById('fileInput').click();">选择照片</button>
                        <button class="upload-btn upload-btn-secondary" onclick="event.stopPropagation(); document.getElementById('cameraInput').click();">拍一张</button>
                    </div>
                </div>

                <input type="file" id="fileInput" accept="image/*">
                <input type="file" id="cameraInput" accept="image/*" capture="user">

        function clamp(v) { return Math.max(60, Math.min(99, Math.round(v))); }

        function animateScore(from, to, duration) {
            const el = document.getElementById('totalScore');
            const start = performance.now();
            function tick(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                el.textContent = Math.round(from + (to - from) * eased);
                if (progress < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        // ==================== 雷达图 ====================
        function drawRadarChart(scores) {
            const cv = document.getElementById('radarChart');
            const c = cv.getContext('2d');
            const W = cv.width, H = cv.height;
            const cx = W / 2, cy = H / 2, R = 110;
            c.clearRect(0, 0, W, H);

            const labels = Object.keys(scores);
            const values = Object.values(scores);
            const n = labels.length;
            const step = (Math.PI * 2) / n;

            // 背景网格
            for (let ring = 1; ring <= 5; ring++) {
                const r = R * ring / 5;
                c.beginPath();
                for (let i = 0; i <= n; i++) {
                    const angle = -Math.PI / 2 + step * i;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
                }
                c.closePath();
                c.strokeStyle = `rgba(255,255,255,${ring === 5 ? 0.12 : 0.05})`;
                c.lineWidth = 1;
                c.stroke();
            }

            // 辐射线
            for (let i = 0; i < n; i++) {
                const angle = -Math.PI / 2 + step * i;
                c.beginPath();
                c.moveTo(cx, cy);
                c.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
                c.strokeStyle = 'rgba(255,255,255,0.06)';
                c.stroke();
            }

            // 数据区域
            const grad = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
            grad.addColorStop(0, 'rgba(167, 139, 250, 0.35)');
            grad.addColorStop(1, 'rgba(244, 114, 182, 0.35)');

            c.beginPath();
            for (let i = 0; i <= n; i++) {
                const idx = i % n;
                const angle = -Math.PI / 2 + step * idx;
                const val = values[idx] / 100;
                const x = cx + R * val * Math.cos(angle);
                const y = cy + R * val * Math.sin(angle);
                i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
            }
            c.closePath();
            c.fillStyle = grad;
            c.fill();
            c.strokeStyle = 'rgba(167, 139, 250, 0.8)';
            c.lineWidth = 2;
            c.stroke();

            // 数据点
            for (let i = 0; i < n; i++) {
                const angle = -Math.PI / 2 + step * i;
                const val = values[i] / 100;
                const x = cx + R * val * Math.cos(angle);
                const y = cy + R * val * Math.sin(angle);
                c.beginPath();
                c.arc(x, y, 4, 0, Math.PI * 2);
                c.fillStyle = '#c4b5fd';
                c.fill();
                c.strokeStyle = 'white';
                c.lineWidth = 1.5;
                c.stroke();
            }

            // 标签
            c.font = '12px -apple-system, sans-serif';
            c.fillStyle = 'rgba(255,255,255,0.6)';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            for (let i = 0; i < n; i++) {
                const angle = -Math.PI / 2 + step * i;
                const x = cx + (R + 24) * Math.cos(angle);
                const y = cy + (R + 24) * Math.sin(angle);
                c.fillText(labels[i], x, y);
            }
        }

        function renderLegend(scores) {
            const colors = ['#a78bfa', '#f472b6', '#fb923c', '#4ade80', '#f87171', '#60a5fa', '#f9a8d4', '#fbbf24'];

            for (const [name, score] of Object.entries(scores)) {
                html += `
                    <div class="legend-item">
                        <span class="legend-label">${name}</span>
                        <div class="legend-bar-wrap">
                            <div class="legend-bar" style="background: ${colors[i % colors.length]};" data-width="${score}%"></div>
                        </div>
                        <span class="legend-value">${score}</span>
                    </div>`;
                i++;
            }
            document.getElementById('radarLegend').innerHTML = html;

            // 动画触发
            setTimeout(() => {
                document.querySelectorAll('.legend-bar').forEach(bar => {
                    bar.style.width = bar.dataset.width;

            }, 100);
        }

                recs.push('💄 唇妆：选择豆沙色、枫叶色等深色唇膏，避免荧光色');
                recs.push('💄 修容：高光打在下巴尖和鼻梁，侧影从耳际扫向嘴角');
                recs.push('👗 发型：侧分长卷发或八字刘海，露出额头更显气质');
            } else if (faceType.name.includes('柔和')) {
                recs.push('💄 唇妆：选择珊瑚色、玫瑰豆沙等饱满唇色');
                recs.push('💄 高光：重点打在T区和面中，增加饱满感');
                recs.push('👗 发型：空气刘海或蓬松卷发，增加柔和感');
            } else if (faceType.name === '直面型') {
                recs.push('💄 妆容：脸型标准！日系清透、韩系水光、欧美立体都适合');
                recs.push('👗 穿搭：基本不挑衣服，根据身材优势选择风格');
            } else if (faceType.name.includes('微凸')) {
                recs.push('💄 妆容：强调眉眼，弱化唇部，眼线稍上扬增加灵气');
                recs.push('👗 穿搭：简约大气风格更凸显气质');
            } else if (faceType.name.includes('立体')) {
                recs.push('💄 妆容：重点打造眉眼，眼线拉长眼型转移焦点');
                recs.push('👗 发型：侧分长发最佳，微微低头找最佳角度');
            }

            if (scores['眼睛形态'] < 80) {
                recs.push('👁 眼妆：内眼线填满睫毛根部，眼尾稍上扬');
            } else {
                recs.push('👁 眼妆优势：眼睛很有神！可以尝试各种眼影配色');
            }
            if (scores['鼻子立体'] < 80) {
                recs.push('👃 鼻影：从眼窝向鼻梁轻扫，鼻头画小V字');
            }

            if (browType) {
                recs.push('🖌 眉形：' + browType.suggestion);
            }

            // 唇形专属建议
            if (lipType) {
                recs.push('👄 唇色推荐：' + lipType.colorRec);
                recs.push('👄 唇妆技巧：' + lipType.suggestion);

                // 根据唇形类型给出额外护理建议
                if (lipType.name === '薄唇') {
                    recs.push('👄 唇部丰盈：睡前涂厚唇膜，日常用含薄荷成分的唇蜜增加视觉饱满感');
                } else if (lipType.name === '厚唇/欧美唇') {
                    recs.push('👄 唇部修饰：用遮瑕轻拍唇外缘可缩小轮廓，哑光质地比水光更日常');
                } else if (lipType.name === '嘟嘟唇') {
                    recs.push('👄 唇部保养：保持唇部水润是关键！定期去角质+唇膜，让嘟嘟感更精致');
                } else if (lipType.name === '微笑唇') {
                    recs.push('👄 嘴角维护：用遮瑕提亮嘴角，搭配咬唇妆效果最甜美');
                } else if (lipType.name === 'M唇/花瓣唇') {
                    recs.push('👄 唇峰强调：沿天然M形唇峰精准描绘，用哑光唇膏最能体现唇形轮廓');
                } else if (lipType.name === '樱桃唇') {
                    recs.push('👄 唇部放大：唇中央叠涂浅色/亮色唇蜜，打造视觉放大效果');
                } else if (lipType.name === '鹅蛋唇/椭圆唇') {
                    recs.push('👄 百搭唇形：你的唇形什么颜色都能驾驭，根据场合和心情自由选色');
                } else if (lipType.name === '平直唇') {
                    recs.push('👄 唇形利用：保持平直线条的利落感，哑光裸色系最能体现中性高级气质');
                }
            }

            recs.push('👠 身形：高腰裤/裙提高腰线，全身颜色不超过3种');
            recs.push('💖 最重要：自信是最好的妆容！站直、微笑、眼神坚定');
            return recs;
        }

        // ==================== 分享 ====================
        function shareResult() {
            if (!lastResult) return;
            const text = `【AI颜值测评结果】\n综合评分：${lastResult.totalScore}分 ${getStars(lastResult.totalScore)}\n脸型：${lastResult.faceType.name}\n眉形：${lastResult.browType.name}\n唇形：${lastResult.lipType.name}\n${getScoreDesc(lastResult.totalScore)}`;

            if (navigator.share) {
                navigator.share({ title: 'AI颜值测评', text, url: location.href }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('结果已复制到剪贴板')).catch(() => showToast('复制失败'));
            } else {
                showToast('当前浏览器不支持分享');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==================== 历史记录 ====================
        function saveHistory(faceName, score) {
            const history = JSON.parse(localStorage.getItem('beautyHistory') || '[]');
            history.unshift({
                face: faceName,
                score,
                time: new Date().toLocaleString('zh-CN'),
                thumb: currentImageData ? currentImageData.substring(0, 200) : null
            });
            if (history.length > 20) history.pop();
            localStorage.setItem('beautyHistory', JSON.stringify(history));
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('beautyHistory') || '[]');
            const container = document.getElementById('historyContainer');

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="history-empty">
                        <span class="empty-icon">📋</span>
                        <div>还没有测评记录</div>
                        <div style="font-size: 13px; margin-top: 8px;">上传照片开始第一次测评吧</div>
                    </div>`;
                return;
            }

            let html = '<div class="history-list">';
            history.forEach(item => {
                html += `
                    <div class="history-item">
                        <div style="width:56px;height:56px;border-radius:12px;background:rgba(167,139,250,0.15);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;">👤</div>
                        <div class="history-info">
                            <div class="history-face">${item.face}</div>
                            <div class="history-time">${item.time}</div>
                        </div>
                        <div class="history-score">${item.score}</div>
                    </div>`;
            });
            html += '</div>';
            html += `<div class="history-clear"><button onclick="clearHistory()">清空记录</button></div>`;
            container.innerHTML = html;
        }

        function clearHistory() {
            localStorage.removeItem('beautyHistory');
            renderHistory();
            showToast('历史记录已清空');
        }

        // ==================== 重新测试 ====================
        function restart() {
            document.getElementById('resultSection').classList.remove('active');
            uploadSection.style.display = 'block';
            document.getElementById('fileInput').value = '';
            document.getElementById('cameraInput').value = '';
            currentImageData = null;
            lastResult = null;
        }
    </script>
</body>
</html>
