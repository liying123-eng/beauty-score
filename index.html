<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI颜值测评 - 专业脸型五官分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .upload-section {
            border: 3px dashed #ddd;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-section:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .upload-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            font-size: 14px;
            color: #999;
        }
        
        #fileInput {
            display: none;
        }
        
        .preview-section {
            display: none;
            margin-bottom: 30px;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-image {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .analyze-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
        }
        
        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result-section {
            display: none;
        }
        
        .result-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .score-label {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .score-value {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .score-desc {
            font-size: 20px;
            opacity: 0.9;
        }
        
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .analysis-card {
            background: #f8f9ff;
            border-radius: 16px;
            padding: 25px;
            border-left: 4px solid #667eea;
        }
        
        .analysis-card h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .analysis-card .icon {
            font-size: 24px;
        }
        
        .analysis-content {
            color: #555;
            line-height: 1.8;
            font-size: 15px;
        }
        
        .face-type {
            background: #fff3e0;
            border-left-color: #ff9800;
        }
        
        .face-type h3 {
            color: #e65100;
        }
        
        .features {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }
        
        .features h3 {
            color: #2e7d32;
        }
        
        .suggestions {
            background: #e3f2fd;
            border-left-color: #2196f3;
        }
        
        .suggestions h3 {
            color: #1565c0;
        }
        
        .detail-section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .detail-section h4 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .feature-item:last-child {
            border-bottom: none;
        }
        
        .feature-name {
            color: #555;
            font-size: 15px;
        }
        
        .feature-score {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .score-bar {
            width: 100px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .score-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .score-number {
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
            text-align: right;
        }
        
        .recommendation {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .recommendation h4 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .recommendation ul {
            list-style: none;
            padding: 0;
        }
        
        .recommendation li {
            padding: 10px 0;
            padding-left: 25px;
            position: relative;
            color: #555;
            line-height: 1.6;
        }
        
        .recommendation li::before {
            content: "✨";
            position: absolute;
            left: 0;
        }
        
        .restart-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto 0;
        }
        
        .restart-btn:hover {
            background: #667eea;
            color: white;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .score-value {
                font-size: 56px;
            }
            
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌸 AI颜值测评</h1>
            <p>专业脸型分析 + 五官特征评估 + 个性化变美建议</p>

        <div class="upload-section" id="uploadSection">

                <div class="analysis-card features">

                    </div>
                </div>
                
                <div class="analysis-card suggestions">
                    <h3><span class="icon">💡</span> 变美建议</h3>
                    <div class="analysis-content" id="suggestionsResult">
                        生成中...
                    </div>
                </div>
            </div>
            
            <div class="detail-section">
                <h4>📊 五官详细评分</h4>
                <div id="detailScores"></div>
            </div>
            
            <div class="recommendation">
                <h4>🎯 专属变美方案</h4>
                <ul id="recommendationList"></ul>
            </div>
            
            <button class="restart-btn" onclick="restart()">重新测试</button>
        </div>
    </div>

            },

                desc: "眉峰高挑明显，转折角度大，给人凌厉精明的感觉，适合打造强气场妆容。",
                features: "眉峰角度大且位置偏高，眉尾下落明显，整体呈折线形",
                matchFace: ["圆脸", "短脸"],
                suggestion: "挑眉自带气场！想日常柔和些可用眉粉填充眉峰下方三角区域。想更凌厉就用眉笔加强眉峰角度。"
            }
        };
        
        // 眉形-脸型匹配评分表（眉形与脸型的和谐度决定分数）
        const browFaceMatch = {
            // 直面型 - 标准脸型，大部分眉形都适合
            '直面型': { '柳叶眉': 92, '弯月眉': 93, '野生眉': 88, '平眉': 85, '剑眉': 90, '落尾眉': 86, '挑眉': 87 },
            // 微凸面型 - 东亚美人，柔和的眉形更合适
            '微凸面型': { '柳叶眉': 93, '弯月眉': 91, '野生眉': 85, '平眉': 82, '剑眉': 80, '落尾眉': 88, '挑眉': 83 },
            // 丰润型面型 - 脸部线条柔和外扩，需要有弧度的眉形平衡
            '丰润型面型': { '柳叶眉': 90, '弯月眉': 92, '野生眉': 80, '平眉': 75, '剑眉': 82, '落尾眉': 78, '挑眉': 88 },
            // 微凹面型 - 线条内收，需要增加面部存在感的眉形
            '微凹面型': { '柳叶眉': 85, '弯月眉': 88, '野生眉': 90, '平眉': 86, '剑眉': 87, '落尾眉': 82, '挑眉': 84 },
            // 柔和型面型 - 轮廓温婉，搭配柔和或有存在感的眉形
            '柔和型面型': { '柳叶眉': 86, '弯月眉': 89, '野生眉': 91, '平眉': 84, '剑眉': 85, '落尾眉': 83, '挑眉': 82 },

            '立体型面型': { '柳叶眉': 78, '弯月眉': 83, '野生眉': 93, '平眉': 76, '剑眉': 92, '落尾眉': 80, '挑眉': 88 }

        // 脸型类型定义
        const faceTypes = {
            straight: {
                name: "直面型",
                score: 95,
                desc: "眉心—鼻尖—颏前点（E线）基本成直线，上下唇位置协调。这是颌面美学的标准模板，侧面线条流畅自然。",

            slightlyConvex: {

                suggestion: "微凸面型很有东方美感。避免过于厚重的刘海，侧分或中分更能展现你的气质。"
            },
            convex: {
                name: "丰润型面型",
                score: 75,
                desc: "嘴唇饱满前展，面部线条柔和外扩，给人亲和温暖的感觉。这是很有东方特色的面型。",

                suggestion: "你的面型很有亲和力！妆容上可以用深色唇妆增加精致感，高光打在下巴和鼻梁拉长线条。发型选择侧分或八字刘海，露出额头会更显气质。"

            slightlyConcave: {
                name: "微凹面型",

            concave: {
                name: "柔和型面型",

                suggestion: "你的面型很有气质！妆容重点：用高光增加面中饱满度，选择饱满唇色增加立体感。发型可以用蓬松的卷发或空气刘海增加柔和感。"
            },
            fengjie: {
                name: "立体型面型",
                score: 70,
                desc: "面部起伏明显，五官存在感强，是很有记忆点的面型。",
                features: "辨识度高，适合打造个人风格",
                suggestion: "你的面型很有特点！建议：侧分长发修饰轮廓，妆容强调眉眼转移视觉焦点。拍照时微微低头，找到最佳角度。自信是最好的妆容！"

        };
        
        // 上传区域点击
        document.getElementById('uploadSection').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        
        // 文件选择
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        // 拖拽上传
        document.getElementById('uploadSection').addEventListener('dragover', (e) => {
            e.preventDefault();
            e.currentTarget.style.borderColor = '#667eea';
            e.currentTarget.style.background = '#f8f9ff';
        });
        
        document.getElementById('uploadSection').addEventListener('dragleave', (e) => {
            e.currentTarget.style.borderColor = '#ddd';
            e.currentTarget.style.background = 'white';
        });
        
        document.getElementById('uploadSection').addEventListener('drop', (e) => {
            e.preventDefault();
            e.currentTarget.style.borderColor = '#ddd';
            e.currentTarget.style.background = 'white';
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });
        
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('uploadSection').style.display = 'none';
                document.getElementById('previewSection').classList.add('active');
            };
            reader.readAsDataURL(file);
        }
        
        function startAnalysis() {
            document.getElementById('previewSection').classList.remove('active');
            document.getElementById('loadingSection').classList.add('active');
            
            // 模拟分析过程
            setTimeout(() => {
                generateResult();
            }, 3000);
        }
        
        function generateResult() {
            // 随机生成结果（实际应用中这里应该是真实的AI分析）
            const faceTypeKeys = Object.keys(faceTypes);

                <strong>特征：</strong>${randomBrowType.features}<br>

            // 生成推荐方案

            document.getElementById('recommendationList').innerHTML = recommendations.map(r => `<li>${r}</li>`).join('');
            
            // 显示结果
            document.getElementById('loadingSection').classList.remove('active');
            document.getElementById('resultSection').classList.add('active');
        }
