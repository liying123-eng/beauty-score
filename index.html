<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深层欲望测试器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8d5a3;
    font-family: 'SimSun', 'STSong', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 粒子背景 */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: #c9a84c;
    border-radius: 50%;
    opacity: 0;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* 封面页 */
  #cover-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .cover-symbol {
    font-size: 64px;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 20px #c9a84c88);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 20px #c9a84c88); }
    50% { filter: drop-shadow(0 0 40px #c9a84ccc); }
  }

  .cover-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #c9a84c;
    text-shadow: 0 0 30px #c9a84c66;
    margin-bottom: 16px;
  }

  .cover-subtitle {
    font-size: 14px;
    letter-spacing: 3px;
    color: #8a7a5a;
    margin-bottom: 48px;
    line-height: 2;
  }

  .cover-desc {
    font-size: 13px;
    color: #6a5f45;
    line-height: 2;
    margin-bottom: 48px;
    max-width: 400px;
    border: 1px solid #2a2218;
    padding: 20px 24px;
    background: #0d0c09;
  }

  .btn-start {
    background: linear-gradient(135deg, #c9a84c, #8a6a2a);
    color: #0a0a0f;
    border: none;
    padding: 16px 48px;
    font-size: 16px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .btn-start::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }
  .btn-start:hover::before { left: 100%; }
  .btn-start:hover {
    box-shadow: 0 0 30px #c9a84c66;
    transform: translateY(-2px);
  }

  /* 进度条 */
  #progress-bar-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 3px;
    background: #1a1810;
    z-index: 100;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #c9a84c, #e8d5a3);
    transition: width 0.4s ease;
    box-shadow: 0 0 10px #c9a84c;
  }

  /* 题目页 */
  #question-page { display: none; }

  .q-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .q-category {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    color: #c9a84c;
    border: 1px solid #c9a84c44;
    padding: 4px 16px;
    margin-bottom: 20px;
    background: #0d0b06;
  }

  .q-number {
    font-size: 12px;
    color: #4a4030;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .q-text {
    font-size: 20px;
    line-height: 1.8;
    color: #e8d5a3;
    text-shadow: 0 0 20px #c9a84c22;
    padding: 0 10px;
  }

  .options-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 32px;
  }

  .option-btn {
    background: #0d0c09;
    border: 1px solid #2a2218;
    color: #a09070;
    padding: 16px 24px;
    text-align: left;
    font-size: 15px;
    line-height: 1.7;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 100%;
    background: linear-gradient(90deg, #c9a84c11, transparent);
    transition: width 0.3s;
  }
  .option-btn:hover {
    border-color: #c9a84c88;
    color: #e8d5a3;
    transform: translateX(4px);
  }
  .option-btn:hover::before { width: 100%; }
  .option-btn.selected {
    border-color: #c9a84c;
    color: #c9a84c;
    background: #1a1508;
    box-shadow: 0 0 15px #c9a84c22;
  }

  .option-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #4a4030;
    margin-right: 12px;
    font-weight: 700;
  }

  .btn-next {
    display: block;
    width: 100%;
    margin-top: 32px;
    background: transparent;
    border: 1px solid #c9a84c66;
    color: #c9a84c;
    padding: 14px;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    opacity: 0.4;
    pointer-events: none;
  }
  .btn-next.active {
    opacity: 1;
    pointer-events: all;
  }
  .btn-next.active:hover {
    background: #c9a84c11;
    box-shadow: 0 0 20px #c9a84c33;
  }

  /* 分隔线 */
  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c9a84c, transparent);
    margin: 20px auto;
  }

  /* 结果页 */
  #result-page { display: none; }

  .result-title {
    text-align: center;
    font-size: 13px;
    letter-spacing: 4px;
    color: #c9a84c;
    margin-bottom: 8px;
  }

  .result-name {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    color: #e8d5a3;
    letter-spacing: 6px;
    text-shadow: 0 0 40px #c9a84c88;
    margin-bottom: 4px;
  }

  .result-tag {
    text-align: center;
    font-size: 13px;
    color: #6a5f45;
    letter-spacing: 2px;
    margin-bottom: 32px;
  }

  /* 雷达图容器 */
  .radar-wrap {
    position: relative;
    width: 100%;
    max-width: 400px;
    margin: 0 auto 40px;
  }

  /* 欲望排行 */
  .ranking-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: #c9a84c;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #2a2218;
  }

  .rank-item {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
    gap: 12px;
  }

  .rank-num {
    font-size: 11px;
    color: #4a4030;
    width: 20px;
    letter-spacing: 1px;
  }

  .rank-name {
    font-size: 14px;
    color: #e8d5a3;
    width: 60px;
    letter-spacing: 1px;
  }

  .rank-bar-wrap {
    flex: 1;
    height: 6px;
    background: #1a1810;
    position: relative;
    overflow: hidden;
  }

  .rank-bar {
    height: 100%;
    background: linear-gradient(90deg, #c9a84c, #e8d5a3);
    box-shadow: 0 0 8px #c9a84c66;
    transition: width 1s ease;
  }

  .rank-score {
    font-size: 13px;
    color: #c9a84c;
    width: 36px;
    text-align: right;
    letter-spacing: 1px;
  }

  /* 主欲望解读 */
  .main-desire-card {
    background: #0d0c09;
    border: 1px solid #2a2218;
    border-left: 3px solid #c9a84c;
    padding: 24px 28px;
    margin: 32px 0;
    position: relative;
  }

  .mdc-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #c9a84c;
    margin-bottom: 12px;
  }

  .mdc-name {
    font-size: 22px;
    color: #e8d5a3;
    letter-spacing: 4px;
    margin-bottom: 16px;
    text-shadow: 0 0 20px #c9a84c44;
  }

  .mdc-desc {
    font-size: 14px;
    color: #8a7a5a;
    line-height: 2;
    letter-spacing: 0.5px;
  }

  /* 组合解读 */
  .combo-card {
    background: #0d0c09;
    border: 1px solid #1a1810;
    padding: 20px 24px;
    margin-bottom: 16px;
  }

  .combo-title {
    font-size: 12px;
    color: #c9a84c88;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .combo-text {
    font-size: 13px;
    color: #6a5f45;
    line-height: 2;
  }

  /* 鸡汤段 */
  .soul-card {
    background: #0d0c09;
    border: 1px solid #2a2218;
    border-top: 3px solid #c9a84c44;
    padding: 28px 28px 24px;
    margin: 20px 0;
  }

  .soul-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #c9a84c88;
    margin-bottom: 16px;
  }

  .soul-quote {
    font-size: 18px;
    color: #c9a84c;
    letter-spacing: 2px;
    line-height: 1.9;
    margin-bottom: 14px;
    text-shadow: 0 0 20px #c9a84c33;
    font-style: italic;
  }

  .soul-body {
    font-size: 13px;
    color: #6a5f45;
    line-height: 2.1;
    letter-spacing: 0.5px;
  }

  /* 保存图片按钮 */
  .btn-save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 32px;
    background: linear-gradient(135deg, #c9a84c22, #8a6a2a22);
    border: 1px solid #c9a84c66;
    color: #c9a84c;
    padding: 15px;
    font-size: 14px;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }
  .btn-save:hover {
    background: linear-gradient(135deg, #c9a84c33, #8a6a2a33);
    box-shadow: 0 0 20px #c9a84c33;
  }

  /* 微信引流 */
  .wechat-card {
    margin-top: 24px;
    background: #0d0c09;
    border: 1px solid #1a1810;
    padding: 24px;
    text-align: center;
  }

  .wechat-top {
    font-size: 12px;
    color: #4a4030;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .wechat-id {
    display: inline-block;
    font-size: 20px;
    color: #c9a84c;
    letter-spacing: 4px;
    padding: 10px 24px;
    border: 1px solid #c9a84c33;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }
  .wechat-id:hover {
    background: #c9a84c11;
    border-color: #c9a84c66;
  }

  .wechat-copy-tip {
    font-size: 11px;
    color: #c9a84c66;
    letter-spacing: 1px;
    margin-bottom: 4px;
    transition: all 0.3s;
  }

  .wechat-desc {
    font-size: 12px;
    color: #3a3020;
    letter-spacing: 1px;
    line-height: 2;
    margin-top: 8px;
  }

  .btn-retry {
    display: block;
    width: 100%;
    margin-top: 16px;
    background: transparent;
    border: 1px solid #2a2218;
    color: #4a4030;
    padding: 14px;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }
  .btn-retry:hover {
    border-color: #c9a84c44;
    color: #c9a84c;
  }

  /* 加载动画 */
  #loading-page {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .loading-symbol {
    font-size: 48px;
    animation: spin 3s linear infinite;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 20px #c9a84c);
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 13px;
    letter-spacing: 4px;
    color: #c9a84c;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 过渡动画 */
  .fade-in {
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- 粒子 -->
<div id="particles"></div>

<!-- 进度条 -->
<div id="progress-bar-wrap">
  <div id="progress-bar" style="width:0%"></div>
</div>

<div class="container">

  <!-- 封面页 -->
  <div id="cover-page">
    <div class="cover-symbol">⚗</div>
    <div class="cover-title">深层欲望测试器</div>
    <div class="divider"></div>
    <div class="cover-subtitle">
      你以为你清楚自己想要什么<br>
      实际上你只是压抑了它
    </div>
    <div class="cover-desc">
      本测试将探测你10种深层欲望的强度分布<br>
      共30题，每题没有对错<br>
      <br>
      色欲 · 食欲 · 贪欲 · 权欲 · 声欲<br>
      占欲 · 触欲 · 命欲 · 法欲 · 逸欲
    </div>
    <button class="btn-start" onclick="startTest()">开始测试</button>
  </div>

  <!-- 题目页 -->
  <div id="question-page">
    <div class="q-header">
      <div class="q-category" id="q-category">色欲</div>
      <div class="q-number" id="q-number">第 1 题 / 共 30 题</div>
      <div class="divider"></div>
      <div class="q-text" id="q-text">题目内容</div>
    </div>
    <div class="options-wrap" id="options-wrap"></div>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()">下一题 →</button>
  </div>

  <!-- 加载页 -->
  <div id="loading-page">
    <div class="loading-symbol">◈</div>
    <div class="loading-text">正在解读你的欲望结构...</div>
  </div>

  <!-- 结果页 -->
  <div id="result-page">
    <div class="result-title">你的深层欲望画像</div>
    <div class="result-name" id="result-main-name"></div>
    <div class="result-tag" id="result-main-tag"></div>
    <div class="divider"></div>
    <div class="radar-wrap">
      <canvas id="radar-chart"></canvas>
    </div>
    <div class="ranking-title">欲望强度排行</div>
    <div id="ranking-list"></div>
    <div class="main-desire-card">
      <div class="mdc-label">主欲望解读</div>
      <div class="mdc-name" id="mdc-name"></div>
      <div class="mdc-desc" id="mdc-desc"></div>
    </div>
    <div id="combo-section"></div>
    <div id="soul-section"></div>
    <button class="btn-save" onclick="saveImage()">📸 保存结果图片 · 分享给朋友</button>
    <div class="wechat-card">
      <div class="wechat-top">想要更多有趣测试？</div>
      <div class="wechat-id" onclick="copyWechat()" id="wechat-id-text">xingzuofenxi1</div>
      <div class="wechat-copy-tip" id="copy-tip">点击复制微信号</div>
      <div class="wechat-desc">加微信 · 星座 / 性格 / 欲望 / 心理 · 更多测试持续更新</div>
    </div>
    <button class="btn-retry" onclick="retryTest()">重新测试</button>
  </div>

</div>

<script>
// ============ 粒子 ============
(function() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
    container.appendChild(p);
  }
})();

// ============ 题目数据 ============
const CATEGORIES = [
  { key: 'se',   name: '色欲', color: '#c9a84c' },
  { key: 'shi',  name: '食欲', color: '#c9a84c' },
  { key: 'tan',  name: '贪欲', color: '#c9a84c' },
  { key: 'quan', name: '权欲', color: '#c9a84c' },
  { key: 'sheng',name: '声欲', color: '#c9a84c' },
  { key: 'zhan', name: '占欲', color: '#c9a84c' },
  { key: 'chu',  name: '触欲', color: '#c9a84c' },
  { key: 'ming', name: '命欲', color: '#c9a84c' },
  { key: 'fa',   name: '法欲', color: '#c9a84c' },
  { key: 'yi',   name: '逸欲', color: '#c9a84c' },
];

const QUESTIONS = [
  // 色欲 × 3
  { cat: 'se', text: '路上遇见一个非常好看的人，你的第一反应是什么？',
    options: ['试图记住他/她的每一个细节', '多看了几眼，但很快收回视线', '觉得好看，但很快忘了', '几乎没注意'] },
  { cat: 'se', text: '你刷到异常好看的人的照片，会怎么做？',
    options: ['截图收藏，反复看', '点个赞，然后刷走', '看一秒，继续刷', '根本不在意颜值'] },
  { cat: 'se', text: '一个场合里，你最先注意到的是什么？',
    options: ['谁最好看，谁最有吸引力', '氛围和场景', '有没有认识的人', '离场最近的出口'] },

  // 食欲 × 3
  { cat: 'shi', text: '你压力大的时候，最先想做的是什么？',
    options: ['吃点好的犒劳自己', '找人说话', '睡觉', '发呆什么都不想'] },
  { cat: 'shi', text: '你对食物的态度是？',
    options: ['吃是一种仪式，不好吃我宁愿不吃', '吃饱就行，凑合过', '随便，饿了再说', '经常忘记吃饭'] },
  { cat: 'shi', text: '在你心里，和喜欢的人吃饭是什么感觉？',
    options: ['比食物本身更重要，是一种占有', '普通，但温暖', '不如自己一个人吃', '没想过这个问题'] },

  // 贪欲 × 3
  { cat: 'tan', text: '看见别人有好东西，你的内心反应是？',
    options: ['我也要有，最好比他的更好', '欣赏一下，然后回来看自己有什么', '替他高兴', '没什么感觉'] },
  { cat: 'tan', text: '得到一样东西之后，你通常会？',
    options: ['马上想要下一个', '满足一段时间，再慢慢想要别的', '珍惜手里的', '扔在一边很快忘了'] },
  { cat: 'tan', text: '你对"够了"这个词的感受是？',
    options: ['从来没有真正觉得够了', '偶尔够，但很快又不够', '比较容易满足', '很少有强烈的欲望'] },

  // 权欲 × 3
  { cat: 'quan', text: '在一个群体里，你对自己的位置在意吗？',
    options: ['非常在意，必须是说话算数的那个', '有点在意，但不会强求', '无所谓排在哪', '更喜欢待在边缘'] },
  { cat: 'quan', text: '当你的想法被否定，你会怎样？',
    options: ['内心不服，一定要证明自己是对的', '沉默，但会找机会验证', '接受对方意见', '懒得再说'] },
  { cat: 'quan', text: '你喜欢安排别人还是被别人安排？',
    options: ['我来安排，这样最放心', '都行，但如果我安排会更好', '被安排就好，少操心', '两者都不喜欢'] },

  // 声欲 × 3
  { cat: 'sheng', text: '有人用特别好听的声音对你说话，你会？',

let currentQ = 0;
let answers = {};
let scores = {};
let radarChart = null;

// ============ 初始化 ============
function initScores() {
  CATEGORIES.forEach(c => scores[c.key] = 0);
}

function startTest() {
  initScores();
  currentQ = 0;
  answers = {};
  document.getElementById('cover-page').style.display = 'none';
  document.getElementById('question-page').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const cat = CATEGORIES.find(c => c.key === q.cat);

  document.getElementById('q-category').textContent = cat.name;
  document.getElementById('q-number').textContent = `第 ${currentQ + 1} 题 / 共 ${QUESTIONS.length} 题`;
  document.getElementById('q-text').textContent = q.text;

  const wrap = document.getElementById('options-wrap');
  wrap.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
    if (answers[currentQ] === i) btn.classList.add('selected');
    btn.onclick = () => selectOption(i);
    wrap.appendChild(btn);
  });

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = currentQ === QUESTIONS.length - 1 ? '查看结果 →' : '下一题 →';
  if (answers[currentQ] !== undefined) {
    nextBtn.classList.add('active');
  } else {
    nextBtn.classList.remove('active');
  }

  updateProgress();
  document.getElementById('question-page').classList.add('fade-in');
  setTimeout(() => document.getElementById('question-page').classList.remove('fade-in'), 500);
}

function updateProgress() {
  const pct = ((currentQ) / QUESTIONS.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btn-next').classList.add('active');
}

function nextQuestion() {
  if (answers[currentQ] === undefined) return;

  // 计分
  const q = QUESTIONS[currentQ];
  scores[q.cat] += SCORE_MAP[answers[currentQ]];

  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showLoading();
  }
}

function showLoading() {
  document.getElementById('question-page').style.display = 'none';
  const lp = document.getElementById('loading-page');
  lp.style.display = 'flex';
  document.getElementById('progress-bar').style.width = '100%';
  setTimeout(showResult, 2000);
}

function showResult() {
  document.getElementById('loading-page').style.display = 'none';
  const rp = document.getElementById('result-page');
  rp.style.display = 'block';
  rp.classList.add('fade-in');

  // 找主欲望
  let sorted = CATEGORIES.map(c => ({ ...c, score: scores[c.key] }))
    .sort((a, b) => b.score - a.score);

  const main = sorted[0];
  const second = sorted[1];
  const desc = DESIRE_DESC[main.key];

  document.getElementById('result-main-name').textContent = desc.name;
  document.getElementById('result-main-tag').textContent = desc.tag;
  document.getElementById('mdc-name').textContent = desc.name;
  document.getElementById('mdc-desc').textContent = desc.desc;

  // 渲染排行
  const rankList = document.getElementById('ranking-list');
  rankList.innerHTML = '';
  const maxScore = sorted[0].score;
  sorted.forEach((item, i) => {
    const pct = Math.round((item.score / maxScore) * 100);
    const div = document.createElement('div');
    div.className = 'rank-item';
    div.innerHTML = `
      <span class="rank-num">0${i+1}</span>
      <span class="rank-name">${item.name}</span>
      <div class="rank-bar-wrap">
        <div class="rank-bar" style="width:0%" data-pct="${pct}"></div>
      </div>
      <span class="rank-score">${item.score}</span>
    `;
    rankList.appendChild(div);
  });
  setTimeout(() => {
    document.querySelectorAll('.rank-bar').forEach(bar => {
      bar.style.width = bar.dataset.pct + '%';
    });
  }, 100);

  // 组合解读
  const comboSection = document.getElementById('combo-section');
  comboSection.innerHTML = '';
  const combo = getComboDesc(main.key, second.key);
  if (combo) {
    comboSection.innerHTML = `
      <div class="combo-card">
        <div class="combo-title">欲望组合解读 · ${main.name} × ${second.name}</div>
        <div class="combo-text">${combo}</div>
      </div>
    `;
  }

  // 鸡汤段
  const soulSection = document.getElementById('soul-section');
  const soul = SOUL_DESC[main.key];
  if (soul) {
    soulSection.innerHTML = `
      <div class="soul-card">
        <div class="soul-label">欲望与你</div>
        <div class="soul-quote">“${soul.quote}”</div>
        <div class="soul-body">${soul.body}</div>
      </div>
    `;
  }

  // 雷达图
  renderRadar(sorted);
}

function renderRadar(sorted) {
  const labels = sorted.map(s => s.name);
  const data = sorted.map(s => s.score);
  const ctx = document.getElementById('radar-chart').getContext('2d');

  if (radarChart) radarChart.destroy();

  radarChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: 'rgba(201, 168, 76, 0.15)',
        borderColor: '#c9a84c',
        borderWidth: 2,
        pointBackgroundColor: '#c9a84c',
        pointBorderColor: '#0a0a0f',
        pointBorderWidth: 2,
        pointRadius: 4,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0,
          max: 12,
          ticks: {
            display: false,
            stepSize: 3
          },
          grid: { color: '#2a2218' },
          angleLines: { color: '#2a2218' },
          pointLabels: {
            color: '#8a7a5a',
            font: { size: 12, family: 'SimSun' }
          }
        }
      }
    }
  });
}

  return map[key] || null;
}

function retryTest() {
  initScores();
  currentQ = 0;
  answers = {};
  document.getElementById('result-page').style.display = 'none';
  document.getElementById('cover-page').style.display = 'flex';
  document.getElementById('progress-bar').style.width = '0%';
}

function copyWechat() {
  const id = 'xingzuofenxi1';
  navigator.clipboard.writeText(id).then(() => {
    const tip = document.getElementById('copy-tip');
    tip.textContent = '已复制！去微信搜一搜吧 ✔';
    tip.style.color = '#c9a84c';
    setTimeout(() => {
      tip.textContent = '点击复制微信号';
      tip.style.color = '#c9a84c66';
    }, 2000);
  }).catch(() => {
    const tip = document.getElementById('copy-tip');
    tip.textContent = '微信号：xingzuofenxi1';
    tip.style.color = '#c9a84c';
  });
}

function saveImage() {
  const btn = document.querySelector('.btn-save');
  const wechat = document.querySelector('.wechat-card');
  const retry = document.querySelector('.btn-retry');
  btn.style.display = 'none';
  wechat.style.display = 'none';
  retry.style.display = 'none';

  html2canvas(document.getElementById('result-page'), {
    backgroundColor: '#0a0a0f',
    scale: 2,
    useCORS: true,
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = '我的深层欲望画像.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).finally(() => {
    btn.style.display = '';
    wechat.style.display = '';
    retry.style.display = '';
  });
}
</script>
